/* ================== 1. VOICE GREETING (Speech Synthesis API) ================== */
(function () {
  let hasGreeted = false;

  function speakGreeting() {
    if (hasGreeted) return;
    if (!("speechSynthesis" in window)) return;
    hasGreeted = true;

    // Prevent multiple speeches from overlapping — cancel anything in progress first
    window.speechSynthesis.cancel();

    const message =
      "Welcome to my portfolio! Feel free to explore my work and journey. I hope you enjoy your visit!";
    const utterance = new SpeechSynthesisUtterance(message);
    utterance.rate = 0.98;
    utterance.pitch = 1.05;
    utterance.volume = 1;

    function pickVoice() {
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;
      // Prefer a natural-sounding English female voice; fall back gracefully
      const preferredFemale = voices.find(
        (v) =>
          /^en/i.test(v.lang) &&
          /female|zira|samantha|susan|victoria|karen|moira|tessa|google us english|aria/i.test(
            v.name
          )
      );
      const anyEnglish = voices.find((v) => /^en/i.test(v.lang));
      return preferredFemale || anyEnglish || voices[0];
    }

    const voice = pickVoice();
    if (voice) utterance.voice = voice;

    try {
      window.speechSynthesis.speak(utterance);
    } catch (e) {
      console.warn("Speech synthesis unavailable:", e);
    }
  }

  function tryGreetOnLoad() {
    if (!("speechSynthesis" in window)) return;
    const voices = window.speechSynthesis.getVoices();
    if (voices.length) {
      speakGreeting();
    } else {
      // Voice list often loads asynchronously
      window.speechSynthesis.onvoiceschanged = () => speakGreeting();
      setTimeout(speakGreeting, 800); // fallback in case the event never fires
    }
  }

  window.addEventListener("load", () => {
    setTimeout(tryGreetOnLoad, 600);
  });

  // Many browsers block audio/speech until a user gesture. If autoplay was
  // blocked on load, the greeting fires once on the very first interaction
  // instead — it still only ever plays a single time.
  function firstInteractionGreet() {
    speakGreeting();
    document.removeEventListener("click", firstInteractionGreet);
    document.removeEventListener("keydown", firstInteractionGreet);
    document.removeEventListener("touchstart", firstInteractionGreet);
  }
  document.addEventListener("click", firstInteractionGreet, { once: true });
  document.addEventListener("keydown", firstInteractionGreet, { once: true });
  document.addEventListener("touchstart", firstInteractionGreet, { once: true });
})();

/* ================== 2. PREMIUM CLICK SOUND (Web Audio API, no files) ================== */
(function () {
  let audioCtx = null;
  let lastPlayTime = 0;
  const MIN_INTERVAL = 45; // ms — stops overlap/spam on rapid clicking

  function getAudioContext() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playClickSound() {
    const now = performance.now();
    if (now - lastPlayTime < MIN_INTERVAL) return;
    lastPlayTime = now;

    const ctx = getAudioContext();
    if (!ctx) return;

    const t0 = ctx.currentTime;
    const duration = 0.09; // ~90ms — short, soft, premium

    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(1200, t0);
    osc.frequency.exponentialRampToValueAtTime(600, t0 + duration);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.25, t0 + 0.008); // ~25% volume
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(t0);
    osc.stop(t0 + duration + 0.02);

    // Clean up nodes to avoid any memory buildup on repeated clicks
    osc.onended = () => {
      osc.disconnect();
      gain.disconnect();
    };
  }

  // Delegated listener — covers every current AND future clickable element
  // (buttons, nav links, cards, social icons, menu items, etc.) without
  // needing to attach a handler to each one individually.
  const CLICKABLE_SELECTOR =
    "a, button, .btn, .nav-links a, .nav-cta, .mobile-menu a, .glass-card, " +
    ".social-media-card, .social-row a, .cert-nav button, #backToTop, " +
    ".burger, .proj-links a, input[type='submit'], [role='button']";

  document.addEventListener(
    "click",
    (e) => {
      const target = e.target.closest(CLICKABLE_SELECTOR);
      if (target) playClickSound();
    },
    true
  );

  // Unlock the AudioContext on first user gesture (required by autoplay policies)
  function unlockAudio() {
    getAudioContext();
    document.removeEventListener("click", unlockAudio);
    document.removeEventListener("touchstart", unlockAudio);
  }
  document.addEventListener("click", unlockAudio, { once: true });
  document.addEventListener("touchstart", unlockAudio, { once: true });
})();
